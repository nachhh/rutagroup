# Postgres 16 plays the role of Amazon Redshift (RutaShip's legacy AWS warehouse).
# Redshift is a fork of PostgreSQL 8.0, so the SQL dialect is close; the MPP physical layer
# (DISTKEY/SORTKEY, columnar storage) is NOT simulated, we document it in model comments.
services:
  postgres:
    image: postgres:16
    container_name: ruta_pg
    environment:
      POSTGRES_USER: ${PG_USER:-ruta}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-ruta}
      POSTGRES_DB: ${PG_DB:-ruta}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - ruta_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-ruta}"]
      interval: 2s
      retries: 20
volumes:
  ruta_pg_data:
