# Ruta UDL: runs on BigQuery (free tier). Unifies RutaPay (native BQ, nested JSON) with the
# RutaShip replica, resolves the canonical Customer, and hosts the semantic layer + knowledge graph.
# Cost guardrail: maximum_bytes_billed in the profile; partition + cluster large marts.
name: ruta_udl
version: "1.0.0"
config-version: 2
profile: ruta_udl

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
clean-targets: ["target", "dbt_packages"]

models:
  ruta_udl:
    +group: pay_domain               # ownership (models/_groups.yml); cross-product models override to udl_core
    staging:
      +materialized: view
      +schema: staging
      +access: private
      ship_replica:                  # staging over the replicated RutaShip public marts → owned by the UDL team
        +group: udl_core
    intermediate:
      +materialized: view
      +schema: intermediate
      +access: private
      entity_resolution:             # crosswalk = the heart of the UDL
        +group: udl_core
    marts:
      +materialized: table
      +schema: marts
      +access: protected             # data products opt in to `public` in _marts.yml
      # Push dbt descriptions to BigQuery column descriptions (and policy tags, when configured).
      +persist_docs: {relation: true, columns: true}
      udl:                           # conformed, cross-product marts (Phase 4)
        +group: udl_core
    kg:                              # knowledge graph, GENERATED from ontology/ruta_ontology.yml (make ontology)
      +materialized: table
      +schema: kg
      +group: udl_core
      +access: public

seeds:
  ruta_udl:
    +schema: seeds

data_tests:
  ruta_udl:
    +group: pay_domain
