version: 2

models:
  - name: int_customer_candidates
    description: "Grain: 1 row per source record (current shipper or Pay account), normalized for matching."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system, source_id]
  - name: int_customer_pairs
    description: "Grain: 1 row per blocked (shipper, account) pair where a rule fired. Veto → score → routing."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [shipper_id, account_id]
    columns:
      - name: routing
        data_tests:
          - accepted_values:
              arguments:
                values: [auto_merge, review, review_conflict]
  - name: int_customer_matches
    description: "Grain: 1 row per accepted match (auto_merge + steward decisions), enforced 1:1."
    columns:
      - name: shipper_id
        data_tests: [unique, not_null]
      - name: account_id
        data_tests: [unique, not_null]
  - name: int_customer_review_queue
    description: "Grain: 1 row per undecided ambiguous pair, for data stewards."
  - name: int_customer_clusters
    description: "Grain: 1 row per source record → today's match cluster (cluster_id = anchor). Stateless, no key."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system, source_id]
  - name: int_customer_key_registry
    description: >
      Grain: 1 row per (source record, key assignment). Append-only log, full_refresh=false: the only state in
      entity resolution. Current key = latest row per record. Rules: keep, inherit, merge (oldest key wins), split, new.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system, source_id, assigned_at]
    columns:
      - name: customer_key
        data_tests: [not_null]
      - name: reason
        data_tests:
          - accepted_values:
              arguments:
                values: [migrated, new, inherit, merge, split]
  - name: int_customer_xwalk
    description: "Grain: 1 row per source record → canonical customer_key (read from the key registry). The crosswalk of the UDL."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system, source_id]
    columns:
      - name: customer_key
        data_tests: [not_null]

unit_tests:
  # The matching RULES are business logic → unit-test them with crafted records (no warehouse data involved).
  - name: test_matching_rules_veto_and_routing
    model: int_customer_pairs
    given:
      - input: ref('int_customer_candidates')
        rows:
          # 1) same tax id, different-looking names → tax_id_exact, auto_merge
          - {source_system: ship, source_id: "1", name_norm: transportes garcia, tax_id_norm: B11111111, email_sha256: h1, email_domain: garcia.es, is_personal_domain: false, country: ES}
          - {source_system: pay,  source_id: a1,  name_norm: transp garcia,      tax_id_norm: B11111111, email_sha256: x1, email_domain: other.es,  is_personal_domain: false, country: ES}
          # 2) decoy: identical name + same domain but DIFFERENT tax ids → veto wins → review_conflict
          - {source_system: ship, source_id: "2", name_norm: alimentos rio, tax_id_norm: B22222222, email_sha256: h2, email_domain: rio.es, is_personal_domain: false, country: ES}
          - {source_system: pay,  source_id: a2,  name_norm: alimentos rio, tax_id_norm: F99999999, email_sha256: x2, email_domain: rio.es, is_personal_domain: false, country: ES}
          # 3) tax id missing on one side, same corporate email hash → email_exact, auto_merge
          - {source_system: ship, source_id: "3", name_norm: grupo vega, tax_id_norm: null, email_sha256: h3, email_domain: vega.mx, is_personal_domain: false, country: MX}
          - {source_system: pay,  source_id: a3,  name_norm: grupo vegas, tax_id_norm: A33333333, email_sha256: h3, email_domain: vega.mx, is_personal_domain: false, country: MX}
          # 4) only a similar name, personal email domain → name_only, review
          - {source_system: ship, source_id: "4", name_norm: textiles jacobs, tax_id_norm: null, email_sha256: h4, email_domain: gmail.com, is_personal_domain: true, country: CO}
          - {source_system: pay,  source_id: a4,  name_norm: textiles jacob,  tax_id_norm: null, email_sha256: x4, email_domain: gmail.com, is_personal_domain: true, country: CO}
    expect:
      rows:
        - {shipper_id: "1", account_id: a1, match_rule: tax_id_exact, routing: auto_merge, tax_conflict: false}
        - {shipper_id: "2", account_id: a2, match_rule: domain_and_name, routing: review_conflict, tax_conflict: true}
        - {shipper_id: "3", account_id: a3, match_rule: email_exact, routing: auto_merge, tax_conflict: false}
        - {shipper_id: "4", account_id: a4, match_rule: name_only, routing: review, tax_conflict: false}

  # The key registry is an INCREMENTAL model whose logic only runs when is_incremental() is true: mock `this` (the
  # existing log) and override the macro. Scenarios use clusters that already own keys, so no key is minted
  # (minted keys are salted with invocation_id and can't be predicted in a fixture).
  - name: test_key_registry_keep_inherit_merge
    description: >
      s1 keeps K100 (no row). a2 joins s1's cluster → inherit K100. s3 (K300, older) and a3 (K301) now share a
      cluster → oldest key wins: a3 moves to K300 (merge); s3 keeps K300 (no row).
    model: int_customer_key_registry
    overrides:
      macros: {is_incremental: true}
    given:
      - input: ref('int_customer_clusters')
        rows:
          - {source_system: ship, source_id: s1, cluster_id: "pay:a2"}
          - {source_system: pay,  source_id: a2, cluster_id: "pay:a2"}
          - {source_system: ship, source_id: s3, cluster_id: "pay:a3"}
          - {source_system: pay,  source_id: a3, cluster_id: "pay:a3"}
      - input: this
        rows:
          - {source_system: ship, source_id: s1, customer_key: 100, assigned_at: "2026-01-01 00:00:00"}
          - {source_system: ship, source_id: s3, customer_key: 300, assigned_at: "2026-01-01 00:00:00"}
          - {source_system: pay,  source_id: a3, customer_key: 301, assigned_at: "2026-02-01 00:00:00"}
    expect:
      rows:
        - {source_system: pay, source_id: a2, customer_key: 100, reason: inherit, previous_key: null}
        - {source_system: pay, source_id: a3, customer_key: 300, reason: merge,   previous_key: 301}
  - name: test_key_registry_split
    description: >
      s5 and a5 shared K500; a steward split them. The key stays with the side that held it longest (s5, since
      January) → no row for s5; a5 gets a new key (reason split). customer_key is not compared: it is minted.
    model: int_customer_key_registry
    overrides:
      macros: {is_incremental: true}
    given:
      - input: ref('int_customer_clusters')
        rows:
          - {source_system: ship, source_id: s5, cluster_id: "ship:s5"}
          - {source_system: pay,  source_id: a5, cluster_id: "pay:a5"}
      - input: this
        rows:
          - {source_system: ship, source_id: s5, customer_key: 500, assigned_at: "2026-01-01 00:00:00"}
          - {source_system: pay,  source_id: a5, customer_key: 500, assigned_at: "2026-03-01 00:00:00"}
    expect:
      rows:
        - {source_system: pay, source_id: a5, reason: split, previous_key: 500}
