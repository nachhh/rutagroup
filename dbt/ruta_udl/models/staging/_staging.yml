version: 2

models:
  - name: stg_pay__accounts
    description: "Grain: 1 row per RutaPay account. Primary address picked per decision 2A."
    config:
      # PROTECTED (not private): the pay_domain → udl_core interface inside this shared project.
      # In a real dbt Mesh, Pay would be its own project exposing a PUBLIC contracted model instead.
      access: protected
      meta: {classification: confidential}
    columns:
      - name: account_id
        data_tests: [unique, not_null]
      # Classification travels with the column. The source column raw_pay.accounts.billing_contact.email
      # also carries a BigQuery POLICY TAG (scripts/setup_bq_governance.py), so this view is enforced too.
      - name: contact_email
        config: {meta: {pii: true, classification: confidential}, tags: [pii]}
      - name: contact_phone
        config: {meta: {pii: true, classification: confidential}, tags: [pii]}
      - name: contact_name
        config: {meta: {pii: true, classification: confidential}, tags: [pii]}
  - name: stg_pay__invoices
    description: "Grain: 1 row per invoice header."
    config:
      access: protected   # pay_domain → udl_core interface (invoice ↔ shipment link for the KG)
    columns:
      - name: invoice_id
        data_tests: [unique, not_null]
      - name: account_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_pay__accounts')
                field: account_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [paid, open, void, uncollectible]
  - name: stg_pay__invoice_lines
    description: "Grain: 1 row per invoice line (UNNEST of invoices.lines)."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [invoice_id, line_no]
    columns:
      - name: revenue_type
        data_tests:
          - accepted_values:
              arguments:
                values: [subscription, txn_fee, freight_fee, pass_through]
  - name: stg_pay__payment_events
    description: "Grain: 1 row per distinct webhook event (deduplicated with QUALIFY)."
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: event_type
        data_tests:
          - accepted_values:
              arguments:
                values: [payment.succeeded, payment.failed]
