version: 2

sources:
  - name: raw_ship
    description: RutaShip raw tables, bulk-loaded (on real Redshift via COPY from S3).
    schema: raw_ship
    # Source freshness = a data SLA. `dbt source freshness` checks max(loaded_at_field).
    # The generated history ends 2026-10-31, so expect a WARN today: that's the demo.
    config:
      freshness:
        warn_after: {count: 2, period: day}
        error_after: {count: 30, period: day}
    tables:
      - name: shippers
        description: One row per shipper (current state; mutable → snapshotted).
        config:
          loaded_at_field: updated_at
      - name: carriers
        config: {freshness: null}   # static reference data: no SLA
      - name: lanes
        config: {freshness: null}
      - name: shipments
        description: One row per shipment, current status (rows are UPDATED as status changes).
        config:
          loaded_at_field: updated_at
      - name: shipment_events
        description: Append-only tracking events.
        config:
          loaded_at_field: event_ts
