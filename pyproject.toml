[project]
name = "ruta"
version = "0.1.0"
description = "Unified Data Layer + Semantic Layer playground"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-core>=1.10,<1.13",
    "dbt-postgres>=1.9",
    "dbt-bigquery>=1.10",
    "dbt-metricflow[dbt-postgres,dbt-bigquery]>=0.11",
    "google-cloud-bigquery>=3.25",
    "pyarrow>=17",
    "psycopg[binary]>=3.2",
    "faker>=30",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false
